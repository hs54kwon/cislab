# CIS Lab roster
#
# HOW TO ADD YOURSELF (students):
#   1. Add a block under the right group. Only `name` is required.
#      Every other field is optional and is simply not rendered if you omit it.
#      Never leave a field present-but-empty: delete the line instead. (The old
#      Google Sites page showed bare "E-mail:" labels with nothing after them.)
#   2. Put a square photo in assets/img/people/<file>.jpg (400x400 or larger)
#      and set `image:` to the file name. Omit `image` and you get a neutral
#      placeholder, which is fine.
#   3. Open a pull request. That PR is your first commit to the lab.
#
# Fields: name, image, role, year, email, topic, scholar, github, homepage
# -----------------------------------------------------------------------------

