# Colour of the venue badge shown next to each publication.
# The key must match the `abbr` field in _bibliography/papers.bib exactly.
#
# `tier:` and `percentile:` print small markers under the badge. They are set
# once per venue here, not per paper. A bib entry can override either, or
# suppress with `tier = {none}` (the two posters do this).
#
# Convention: conferences get `tier: Top-tier`; journals get `tier: Q1` plus a
# `percentile:` for the field rank. `tier_note:` becomes a hover tooltip and
# should record WHICH ranking and WHICH year the number came from, so the
# figures can be re-checked later.
#
# !! The percentile values below are UNVERIFIED estimates. See README. !!

