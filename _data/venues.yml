# Venue badge next to each publication.
# The key must match the `abbr` field in _bibliography/papers.bib exactly.
#
# color:  encodes TYPE only, and there are just two.
#           #00539b = conference   |   #5a6b7a = journal
#         Standing is carried by the markers below, not by the colour.
#
# tier:   the stronger marker. Conferences use "Top-tier", journals use "Q1".
# rank:   the quieter second marker. Holds a BK list score for conferences
#         ("BK 4") or a field percentile for journals ("Top 10%").
#
# Both are set once per venue here, never per paper. A bib entry may override
# either, or suppress both with `tier = {none}` (the two posters do this).
#
# Percentiles and BK scores below were confirmed by the PI on 2026-09-15.
# Values are only present where they were actually checked; a venue with no
# `tier`/`rank` simply shows no marker, which is the correct default.

# ----------------------------- conferences ---------------------------------

